name: Security Audit

on: [push, pull_request]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install bandit

      - name: Run Bandit Scan
        run: bandit -r src/ -ll